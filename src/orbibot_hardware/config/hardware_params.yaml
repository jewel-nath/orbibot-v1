# OrbiBot Hardware Configuration
orbibot_hardware_node:
  ros__parameters:
    # Hardware Configuration
    hardware:
      serial_port: "/dev/motordriver"
      data_timeout: 5.0   # seconds without firmware data → hardware_connected = false (S1/S2)
                         # Increased from 2.0: firmware sends at 50Hz but serial buffers can
                         # cause brief gaps; 2s was too tight and caused spurious disconnects.

    # Robot geometry (R2) — wheel radius (m), encoder edges per revolution
    robot:
      wheel_radius: 0.05
      encoder_edges_per_rev: 1320

    # Control Parameters
    control:
      cmd_timeout: 2.0           # seconds - stop if no command received
      max_velocity: 1.0          # m/s - maximum linear velocity
      max_angular_velocity: 2.0  # rad/s - maximum angular velocity
      pid_rate_limit: 0.1        # seconds - minimum interval between PID topic updates (max 10Hz)

    # Update Rates (Hz)
    rates:
      sensor_rate: 50.0          # Sensor data publishing (IMU, encoders, joint states)
      status_rate: 10.0          # System status publishing

    # Safety Parameters
    safety:
      battery_low_threshold: 11.0    # Volts - low battery warning
      battery_critical_voltage: 10.5 # Volts - critical battery level (auto-disable)

    # IMU covariance (R4) — per-axis diagonal entries for accel and gyro.
    # Re-measure with:
    #   ros2 run orbibot_localization measure_imu_noise --ros-args -p duration:=600.0
    #
    # Measured 2026-08-04, 29977 samples over 10 min, robot elevated on a stool,
    # motors disabled, Beelink not yet mounted. Replaces figures from 2026-03-24
    # that came from 212 samples on the Raspberry Pi, through the accelerometer
    # path that was later found faulty (CC-3).
    #
    # ⚠️ THIS IS THE STATIONARY NOISE FLOOR — a lower bound, not the operating
    # value. Mecanum vibration under motion will raise all six, and the EKF's
    # Mahalanobis rejection scales as 1/sqrt(covariance): shrinking gyro Z by
    # 19x tightens `imu0_twist_rejection_threshold` by ~4.4x in absolute terms,
    # which can start rejecting good data once the robot moves. **Re-measure
    # while driving before Phase 1 tuning** — roadmap 1.3 / 4.1.
    #
    # Only `gyro_covariance_z` actually reaches the EKF: imu0_config fuses yaw
    # and vyaw only, so the accel entries and gyro X/Y are read by nothing here.
    # They are kept measured because they document the sensor, and because
    # enabling accel fusion later would make them live. See
    # src/orbibot_localization/README.md.
    imu:
      accel_covariance_x: 5.277280e-05  # (m/s²)² — stationary floor, 2026-08-04
      accel_covariance_y: 5.395034e-05
      accel_covariance_z: 1.664637e-04
      gyro_covariance_x: 5.910444e-07   # (rad/s)² — stationary floor, 2026-08-04
      gyro_covariance_y: 5.854038e-07
      gyro_covariance_z: 5.160473e-08   # was 1e-6 — 19x too large, and the one the EKF reads
      orientation_covariance: 0.0025    # NOT measured — Madgwick's orientation_stddev
                                        # (0.05 rad) is what the EKF actually uses for yaw

      # Magnetometer calibration block removed 2026-04-28 — magnetometer
      # support was dropped from firmware and driver. Heading correction is
      # provided by Madgwick (gyro+accel only) + EKF + slam_toolbox/AMCL.

    # Odometry Covariance (adaptive, grows with distance/rotation)
    odometry:
      pose_base: 0.001       # Base position variance (m²)
      pose_drift: 0.02       # Position drift rate (variance per meter traveled)
      yaw_base: 0.01         # Base yaw variance (rad²)
      yaw_drift: 0.005       # Yaw drift rate (variance per radian rotated)
      velocity_base: 0.01    # Base velocity variance ((m/s)²)
      velocity_scale: 0.1    # Velocity variance scale with speed
      covariance_decay: 0.99 # Exponential decay factor for accumulated drift (0–1)
      heartbeat_interval: 0.5 # s; re-publish unchanged odom for late-joining subscribers (0=disable)
