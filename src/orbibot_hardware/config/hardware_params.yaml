# OrbiBot Hardware Configuration
orbibot_hardware_node:
  ros__parameters:
    # Hardware Configuration
    hardware:
      serial_port: "/dev/motordriver"
      data_timeout: 2.0   # seconds without firmware data → hardware_connected = false (S1/S2)

    # Robot geometry (R2) — wheel radius (m), encoder edges per revolution
    robot:
      wheel_radius: 0.05
      encoder_edges_per_rev: 1320

    # Control Parameters
    control:
      cmd_timeout: 2.0           # seconds - stop if no command received
      max_velocity: 1.0          # m/s - maximum linear velocity
      max_angular_velocity: 2.0  # rad/s - maximum angular velocity
      pid_rate_limit: 0.1        # seconds - minimum interval between PID topic updates (max 10Hz)

    # Update Rates (Hz)
    rates:
      sensor_rate: 50.0          # Sensor data publishing (IMU, encoders, joint states)
      status_rate: 10.0          # System status publishing

    # Safety Parameters
    safety:
      battery_low_threshold: 11.0    # Volts - low battery warning
      battery_critical_voltage: 10.5 # Volts - critical battery level (auto-disable)

    # IMU covariance (R4) — per-axis diagonal entries for accel and gyro.
    # Run `ros2 run orbibot_localization measure_imu_noise` to get measured values.
    # Firmware also computes these at boot via Welford's algorithm (see boot log).
    imu:
      accel_covariance_x: 0.000081  # (m/s²)² — measured 2026-03-24, 212 samples, robot stationary
      accel_covariance_y: 0.000053
      accel_covariance_z: 0.000041
      gyro_covariance_x: 0.000001  # (rad/s)² — measured 2026-03-24
      gyro_covariance_y: 0.000026
      gyro_covariance_z: 0.000001
      orientation_covariance: 0.0025

      # Magnetometer calibration (Python-side correction in hardware_node._publish_mag).
      # Firmware has a 3x3 soft-iron matrix capability but it is NOT activated — all
      # correction happens here. Run: ros2 run orbibot_localization calibrate_magnetometer
      # Hard-iron bias (Tesla): constant offset from motors and battery permanent magnets.
      # Calibrated 2026-03-15 via 3 × 360° rotation.
      mag_hard_iron_x: -0.00005452
      mag_hard_iron_y: -0.00000832
      mag_hard_iron_z:  0.00007170
      # Soft-iron scale (dimensionless): corrects axis-dependent distortion from ferromagnetic material.
      # 1.0 = no correction (default until soft-iron calibration is run).
      # Run calibrate_magnetometer and copy the printed scale values here.
      mag_soft_iron_scale_x: 1.0
      mag_soft_iron_scale_y: 1.0
      mag_soft_iron_scale_z: 1.0

    # Odometry Covariance (adaptive, grows with distance/rotation)
    odometry:
      pose_base: 0.001       # Base position variance (m²)
      pose_drift: 0.02       # Position drift rate (variance per meter traveled)
      yaw_base: 0.01         # Base yaw variance (rad²)
      yaw_drift: 0.005       # Yaw drift rate (variance per radian rotated)
      velocity_base: 0.01    # Base velocity variance ((m/s)²)
      velocity_scale: 0.1    # Velocity variance scale with speed
      covariance_decay: 0.99 # Exponential decay factor for accumulated drift (0–1)
      heartbeat_interval: 0.5 # s; re-publish unchanged odom for late-joining subscribers (0=disable)
