# OrbiBot SLAM Parameters

slam_toolbox:
  ros__parameters:
    use_sim_time: false

    # General Parameters
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    # Performance Parameters
    # TODO(phase-5): re-derive. These were fitted to a Raspberry Pi 5, replaced
    # 2026-08-03 by a Beelink SER5 Pro (8C/16T). Inherited, not measured.
    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05  # Reduced from 0.02 - 20Hz is sufficient
    map_update_interval: 5.0        # Increased from 2.0 - reduces CPU load significantly
    resolution: 0.05
    min_laser_range: 0.15  # RPLidar A1 minimum usable range; prevents near-robot free-space errors
    max_laser_range: 8.0
    minimum_time_interval: 0.3
    transform_timeout: 0.2
    transform_tolerance: 0.1
    tf_buffer_duration: 10.0        # Reduced from 30.0 - saves memory
    stack_size_to_use: 20000000     # Reduced from 40000000 - 20MB is sufficient
    enable_interactive_mode: false  # Disabled - saves memory, not needed for normal operation

    publish_period_sec: 0.05
    map_start_pose: [0.0, 0.0, 0.0]
    map_start_at_dock: false

    # Initial map bounds — slam_toolbox expands dynamically but starting larger
    # avoids early reallocation when the robot leaves a 10m radius
    width: 20
    height: 20

    # Mapping Parameters
    # TODO(phase-5): re-derive. Traded map quality for CPU on hardware that is
    # no longer fitted — see docs/plan/roadmap.md Phase 5.
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.35  # Balanced: responsive but CPU-efficient (not 0.5 - too slow)
    minimum_travel_heading: 0.35   # ~20 degrees
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 8.0
    link_match_minimum_response_fine: 0.15  # Relaxed — 0.3 was too strict, rejected valid scans in low-feature areas
    link_scan_maximum_distance: 1.0
    loop_search_maximum_distance: 3.0     # Wider loop closure search (was 2.0)
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Scan Matching
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.06  # More drift-tolerant (was 0.03 — too tight)

    # Correlation Parameters - Loop Closure
    loop_search_space_dimension: 6.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.06  # Match correlation smear (was 0.03)

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # Free-space and obstacle reliability
    min_pass_through: 2         # Improves free-space reliability
    occupancy_threshold: 0.1    # Controls obstacle marking threshold