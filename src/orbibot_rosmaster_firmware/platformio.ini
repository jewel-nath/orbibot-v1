[platformio]
src_dir = src
include_dir = include

[env:orbibot]
platform = ststm32
board = genericSTM32F103RC
framework = cmsis
extra_scripts = pre:git_version.py

; ststm32 asks for toolchain-gccarmnoneeabi >=1.60301.0,<1.80000.0. Every
; release in that range predates the linux_aarch64 build, so resolution fails
; on the robot's Pi 5 — not because PlatformIO lacks ARM64 support, but because
; the version window closes before it. 1.120301.0 is the first that ships
; linux_aarch64 and builds this project unchanged.
platform_packages =
    platformio/toolchain-gccarmnoneeabi@~1.120301.0

; Serial upload configuration (works on both Linux and Windows)
upload_protocol = serial
upload_port = /dev/motordriver  ; Linux: /dev/motordriver or /dev/ttyUSB* | Windows: COM6
monitor_speed = 115200
monitor_echo = yes

build_flags =
    -D STM32F10X_HD
    -D USE_STDPERIPH_DRIVER
    -D ORBIBOT_FIRMWARE
    -I include
    -I lib/FreeRTOS/inc
    -I lib/FreeRTOS/src
    -I lib/STM32F10x_StdPeriph_Driver/inc
    -Os
    -Wall
    -Wextra
    -Werror
    -Wno-unused-parameter
    -ffunction-sections
    -fdata-sections

build_src_filter =
    +<**/*.c>
    +<../lib/FreeRTOS/src/*.c>
    +<../lib/STM32F10x_StdPeriph_Driver/src/*.c>

lib_ldf_mode = deep+
