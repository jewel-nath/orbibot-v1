[platformio]
src_dir = src
include_dir = include

[env:orbibot]
platform = ststm32
board = genericSTM32F103RC
framework = cmsis

; Serial upload configuration (works on both Linux and Windows)
upload_protocol = serial
upload_port = /dev/motordriver  ; Linux: /dev/motordriver or /dev/ttyUSB* | Windows: COM6
monitor_speed = 115200
monitor_echo = yes

build_flags =
    -D STM32F10X_HD
    -D USE_STDPERIPH_DRIVER
    -D ORBIBOT_FIRMWARE
    -I include
    -I lib/FreeRTOS/inc
    -I lib/FreeRTOS/src
    -I lib/STM32F10x_StdPeriph_Driver/inc
    -Os
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-implicit-function-declaration
    -ffunction-sections
    -fdata-sections

build_unflags =
    -Werror

build_src_filter =
    +<**/*.c>
    +<../lib/FreeRTOS/src/*.c>
    +<../lib/STM32F10x_StdPeriph_Driver/src/*.c>

lib_ldf_mode = deep+
