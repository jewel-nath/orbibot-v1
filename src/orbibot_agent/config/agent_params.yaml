# OrbiBot Agent Configuration

safety:
  max_linear_vel: 0.5    # m/s
  max_angular_vel: 2.0   # rad/s
  max_duration: 10.0     # seconds
  sensor_timeout: 3.0    # seconds

# API keys: set in src/orbibot_agent/.env.local or export in your shell before launching.
# Each provider reads the environment variable named by api_key_env.

llm_providers:
  gemini:
    model: "gemini-2.0-flash"            # upgraded from gemini-3.1-flash-lite-preview
    api_key_env: "GEMINI_API_KEY"

  anthropic:
    model: "claude-3-5-sonnet-20241022"
    api_key_env: "ANTHROPIC_API_KEY"

  moonshot:
    model: "kimi-latest"
    api_key_env: "MOONSHOT_API_KEY"

  ollama:
    model: "llama3.1:8b"
    base_url: "http://localhost:11434/v1"

# Default provider to use
default_provider: "gemini"

# RobotTester mode — uses a stronger model and a dedicated system prompt
# for systematic, pass/fail hardware and navigation testing.
robot_tester:
  provider: "anthropic"
  model: "claude-3-5-sonnet-20241022"
  prompt_file: ""    # leave empty to use built-in prompt; or set absolute path to robot_tester_prompt.txt

# Chat server settings
chat_server:
  max_workers: 2     # dedicated thread pool size for chat requests
