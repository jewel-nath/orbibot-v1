# OrbiBot Madgwick IMU Filter Parameters
# Fuses /imu/data_raw (accel+gyro only — mag removed 2026-04-28) → /imu/data_filtered
#
# Key tuning notes:
#   gain (beta): Higher = faster convergence, more vibration-sensitive
#                Lower  = smoother but slower convergence
#                0.033 = Madgwick paper default, 0.1 = common for robots
#   zeta: Gyro bias drift correction rate. With use_mag=false this becomes
#         less effective (no absolute reference). 0.0 disables it entirely.
#   orientation_stddev: Reported orientation uncertainty for EKF weighting.
#         0.05 = ~3° std dev — realistic for ICM-20948 + Madgwick (gyro+accel)

imu_filter_madgwick:
  ros__parameters:
    use_mag: false
    publish_tf: false
    world_frame: enu
    fixed_frame: odom
    gain: 0.1
    zeta: 0.0
    orientation_stddev: 0.05
    frequency: 50.0
    stateless: false
    remove_gravity_vector: false
    constant_dt: 0.0
    yaw_offset: 0.0
